services:
  postgres:
    # pgvector 镜像 = postgres 17 + vector 扩展（知识库向量召回）；
    # 已有 pgdata 卷可无缝换镜像，扩展由 0007 迁移的守卫式 DDL / init 脚本补建
    image: pgvector/pgvector:pg17
    container_name: biance-vision-postgres
    restart: unless-stopped
    ports:
      - "5434:5432" # 避让本机已占用的 5432/5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biance_vision
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-biance-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 一次性迁移容器（W3-S2）：DDL 先行，app/worker 以 BV_AUTO_MIGRATE=0 不再承担迁移；
  # 幂等可重复执行；失败（退出码 1）会阻止 app/worker 启动（depends_on completed_successfully）
  migrate:
    image: biance-vision:latest
    container_name: biance-vision-migrate
    restart: "no"
    command: ["node", "server/dist/dbMigrate.js"]
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://biance_app:biance_app@postgres:5432/biance_vision
      # W3-S4：user-api 最小权限账号密码（与 app 的 DATABASE_URL 同源注入；
      # 生产真实值写在 VPS ~/biance-vision/.env，不入库）
      BV_DB_USER_PASSWORD: ${BV_DB_USER_PASSWORD:-biance_user_local}
    volumes:
      # 内置账号种子（W3-S4：seed 只在 migrate 容器执行）
      - ./server/data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy

  # 独立官网；只读公开联系方式目录，不挂载 AI Key、账号或会话目录。
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        WEBSITE_ORIGIN: ${WEBSITE_ORIGIN:-http://localhost:3100}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    image: biance-vision-website:latest
    container_name: biance-vision-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m
    environment:
      WEBSITE_ORIGIN: ${WEBSITE_ORIGIN:-http://localhost:3100}
      # pricing 页服务端直连用户 API 取会员目录（价格进初始 HTML）；app 为 compose 服务名
      WEBSITE_API_ORIGIN: ${WEBSITE_API_ORIGIN:-http://app:3200}
      WEBSITE_PUBLIC_CONFIG_DIR: /app/website-public
      WEBSITE_TRUST_PROXY: "1"
      WEBSITE_CN_IP_LIST: /app/website/data/cn-ipv4.txt
      WEBSITE_ACCESS_LOG_DIR: /app/website-logs
    volumes:
      - ./server/data/website-public:/app/website-public:ro
      - website-logs:/app/website-logs

  # 用户终端 SPA / API / WebSocket（Caddy 按路径承接）
  app:
    build: .
    image: biance-vision:latest
    container_name: biance-vision-app
    restart: unless-stopped
    ports:
      # W3-S3 收回环：公网入口只剩 Caddy 80/443（app=主域名，admin-api=管理域名）
      - "127.0.0.1:3200:3200"
    environment:
      TZ: Asia/Shanghai # 日志时间戳用北京时间（容器默认 UTC）
      # W3-S4：user-api 用最小权限账号（表级白名单见 server/src/dbGrants.ts；
      # 密码由 migrate 容器按同一 env 同步进 PG）
      DATABASE_URL: postgresql://biance_user:${BV_DB_USER_PASSWORD:-biance_user_local}@postgres:5432/biance_vision
      RESEARCH_PY_URL: http://research-py:8100
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: biance_minio
      MINIO_SECRET_KEY: biance_minio_secret
      MINIO_BUCKET: biance-knowledge
      BV_AUTO_MIGRATE: "0" # 迁移由 migrate 容器先行（W3-S2）
      # 登录限流/幂等等安全状态的主体哈希 key（32B hex）：本地开发给固定默认值零配置可跑；
      # 生产由 deploy/vps/compose.override.yml 强制注入真实值（:?set in .env）
      BV_SUBJECT_HMAC_KEY: ${BV_SUBJECT_HMAC_KEY:-6c6f63616c2d6465762d6f6e6c792d68656b657921}

    # JSON 镜像 + seed-users.json + secrets.json 放宿主机这份目录，容器重建数据不丢
    volumes:
      - ./server/data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 管理 API 独立进程（W3-S3）：只注册管理能力（登录/知识库/agents/evals/AI 配置），
  # 不含任何用户路由；Caddy 管理域名反代 127.0.0.1:3201。与 app 同镜像不同入口。
  admin-api:
    image: biance-vision:latest
    container_name: biance-vision-admin-api
    restart: unless-stopped
    command: ["node", "server/dist/adminApi.js"]
    ports:
      - "127.0.0.1:3201:3200"
    environment:
      TZ: Asia/Shanghai
      WEBSITE_ORIGIN: ${WEBSITE_ORIGIN:-http://localhost:3100}
      DATABASE_URL: postgresql://biance_app:biance_app@postgres:5432/biance_vision
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: biance_minio
      MINIO_SECRET_KEY: biance_minio_secret
      MINIO_BUCKET: biance-knowledge
      BV_AUTO_MIGRATE: "0" # 迁移由 migrate 容器先行（W3-S2）
      # 登录限流/幂等等安全状态的主体哈希 key（32B hex）：本地开发给固定默认值零配置可跑；
      # 生产由 deploy/vps/compose.override.yml 强制注入真实值（:?set in .env）
      BV_SUBJECT_HMAC_KEY: ${BV_SUBJECT_HMAC_KEY:-6c6f63616c2d6465762d6f6e6c792d68656b657921}

    volumes:
      - ./server/data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 队列消费进程：行情采集/补洞 + 知识文档解析（与 app 同镜像不同入口）
  worker:
    image: biance-vision:latest
    container_name: biance-vision-worker
    restart: unless-stopped
    command: ["node", "server/dist/worker.js"]
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://biance_app:biance_app@postgres:5432/biance_vision
      RESEARCH_PY_URL: http://research-py:8100
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: biance_minio
      MINIO_SECRET_KEY: biance_minio_secret
      MINIO_BUCKET: biance-knowledge
      BV_AUTO_MIGRATE: "0" # 迁移由 migrate 容器先行（W3-S2）
      # 登录限流/幂等等安全状态的主体哈希 key（32B hex）：本地开发给固定默认值零配置可跑；
      # 生产由 deploy/vps/compose.override.yml 强制注入真实值（:?set in .env）
      BV_SUBJECT_HMAC_KEY: ${BV_SUBJECT_HMAC_KEY:-6c6f63616c2d6465762d6f6e6c792d68656b657921}

    volumes:
      - ./server/data:/app/server/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 对象存储：知识库原始文件/解析产物（BlobStore 接口；本地开发不设 MINIO_* 时自动落磁盘）
  minio:
    image: minio/minio:latest
    container_name: biance-vision-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: biance_minio
      MINIO_ROOT_PASSWORD: biance_minio_secret
    ports:
      - "127.0.0.1:9110:9000"   # S3 API（仅本机；910x 被 cy-report 占用）
      - "127.0.0.1:9111:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首启动建桶（幂等；跑一次即退出）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 biance_minio biance_minio_secret &&
      mc mb --ignore-existing local/biance-knowledge &&
      echo bucket-ready"

  # Python 研究服务：Docling 文档解析 + 分位 GBM 训练/推理（固定任务端点，无任意代码执行）
  research-py:
    # ❗构建参数实配在 Compose（而非只写脚本/注释）：直接 docker compose build 也不会
    # 落回轻量镜像——本地曾因旧镜像无 Docling 导致知识库 PDF 解析全线失败（根因①，
    # 2026-10-21 诊断）；Dockerfile 的 ARG 默认值 0 仅供 GHCR 轻量变体，本地一律覆盖
    build:
      context: ./research-py
      args:
        WITH_DOCLING: "1"
    image: biance-vision-research-py:latest
    container_name: biance-vision-research-py
    restart: unless-stopped
    # W1-B：research-py 内存硬顶（解析峰值实测 1.15GiB；超限=任务 failed=oom 可重试）
    mem_limit: 2500m
    ports:
      - "127.0.0.1:8100:8100" # 仅本机调试用；容器间走内网名
    environment:
      TZ: Asia/Shanghai
    volumes:
      - research-models:/data/models
      - argos-packages:/root/.local/share/argos-translate

volumes:
  website-logs:
  pgdata:
  research-models:
  minio-data:
  argos-packages:
