services:
  postgres:
    image: postgres:17-alpine
    container_name: biance-vision-postgres
    restart: unless-stopped
    ports:
      - "5434:5432" # 避让本机已占用的 5432/5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biance_vision
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-biance-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
