# 云服务器（Oracle 免费层等）部署覆盖层，与根 docker-compose.yml 叠加使用：
#   BV_VERSION=0.2.1 docker compose -f docker-compose.yml -f deploy/oracle/compose.override.yml up -d
#   （镜像 tag 不带 v 前缀：git tag v0.6.1 → 镜像 :0.6.1）
# - 镜像来自 tag 触发的 GHCR（.github/workflows/release.yml；先本地过 pnpm release:gate 再打 tag）
# - 需 Docker Compose v2.24+（!reset 语法）；BV_VERSION 缺省 latest
services:
  app:
    # 去掉本地构建，改用发版镜像
    build: !reset null
    image: ghcr.io/codevvvv9/biance-vision:${BV_VERSION:-latest}
  worker:
    image: ghcr.io/codevvvv9/biance-vision:${BV_VERSION:-latest}
  research-py:
    build: !reset null
    image: ghcr.io/codevvvv9/biance-vision-research-py:${BV_VERSION:-latest}
  postgres:
    ports: !override
      # 公网服务器只绑回环（根文件 0.0.0.0 暴露 + 弱口令仅适合本机开发；
      # 服务器上仅供本机 pg_dump/调试用，外部访问一律走 app 的 3200）。
      # ports 列表默认追加合并，必须 !override 整体替换才能去掉 0.0.0.0 映射
      - "127.0.0.1:5434:5432"
