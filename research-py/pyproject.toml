[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-py"
version = "0.1.0"
description = "Fixed-task HTTP service: Docling document parsing and quantile GBM training/inference/calibration. No arbitrary code execution."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "pydantic==2.13.5",
    "scikit-learn==1.6.1",
    "joblib==1.5.3",
    "numpy==2.0.2",
    "httpx==0.28.1",
    # docling requires Python >= 3.10 and is heavy (pulls torch); parsing.py
    # lazy-loads it, so the rest of the service runs without it.
    "docling==2.131.0; python_version >= '3.10'",
    # argostranslate pulls CTranslate2 (offline neural MT). translation.py
    # lazy-loads it; without downloaded language pairs the endpoint returns a
    # structured package_missing error and other endpoints are unaffected.
    "argostranslate==1.9.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
