name: Release

# 推送 v 开头的 tag 时触发（如 v0.1.0）；也支持手动触发（重建当前 tag 的镜像与 Release）。
# 发布前本地先过 pnpm release:gate
on:
  push:
    tags: ['v*']
  workflow_dispatch: # gh workflow run release.yml --ref <tag>

permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送镜像到 GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEBSITE_ORIGIN: ${{ vars.WEBSITE_ORIGIN }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @biance/website check:release
      - run: pnpm website:check
      - run: pnpm typecheck
      - run: pnpm build

      # 与 CI 相同的纯自测作为最低门槛（DB 集成门槛在本地 release:gate）
      - run: pnpm brooks:causality
      - run: pnpm brooks:selftest
      - run: pnpm research:calc-check

      - name: Pack release assets
        run: |
          mkdir -p release
          tar -czf release/biance-vision-${{ github.ref_name }}.tar.gz \
            server/dist server/drizzle web/dist web/dist-admin \
            shared/package.json shared/dist \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            server/package.json web/package.json \
            Dockerfile website/Dockerfile website/.next/standalone website/.next/static website/public website/data website/runtime \
            website/package.json packages/shared-ui/package.json packages/brand packages/platform-contracts website/next.config.ts \
            docker-compose.yml docker deploy/vps deploy/oracle README.md

      # Docker 镜像：app 与 worker 同镜像（worker 以不同入口跑），research-py 独立构建
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/metadata-action@v5
        id: meta-website
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-website
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ${{ steps.meta-website.outputs.tags }}
          build-args: |
            WEBSITE_ORIGIN=${{ env.WEBSITE_ORIGIN }}
            GOOGLE_SITE_VERIFICATION=${{ env.GOOGLE_SITE_VERIFICATION }}
            BING_SITE_VERIFICATION=${{ env.BING_SITE_VERIFICATION }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - uses: docker/metadata-action@v5
        id: meta-py
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-research-py
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./research-py
          push: true
          tags: ${{ steps.meta-py.outputs.tags }}
          # WITH_DOCLING=1 + WITH_MINERU=1：双引擎全量镜像（Docling=数字版主引擎，
          # MinerU=扫描版/复杂版面备选引擎，R2 多路径自动兜底）
          build-args: |
            WITH_DOCLING=1
            WITH_MINERU=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
