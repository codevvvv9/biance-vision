name: CI

# 触发时机：push 到 main，或任何人提 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 安装 pnpm（版本读 package.json 的 packageManager 字段）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        # 严格按 pnpm-lock.yaml 装，防止"我机器上能跑"

      # 类型检查 + 引擎/计算的纯自测（无需数据库；知识库/研究集成 smoke 属于
      # release:gate 本地门槛，依赖库内行情数据，不在无状态 CI 里伪造环境）
      - run: pnpm website:check
      - run: pnpm check:i18n
        # i18n 门禁：词典 zh/en 一致 + admin 页面 t()/text() 用到的 key 必须在词典
        # （v0.18.2 前队列页 18 个 key 漏录线上满屏回显 ui.colQueue 的事故锚点）
      - run: pnpm typecheck
      - run: pnpm brooks:causality
      - run: pnpm brooks:selftest
      - run: pnpm research:calc-check

      # server tsc 编译 + web vite 生产构建
      - run: pnpm build
        # Both Vite builds enforce module-graph isolation (Ant Design stays admin-only).
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:admin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web/dist/
            web/dist-admin/
          retention-days: 7
